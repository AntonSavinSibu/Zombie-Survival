name: Build Zombie Survival APK

on:
  workflow_dispatch:
  push:
    paths:
      - "zombie_mobile.py"
      - "buildozer.spec"
      - ".github/workflows/android.yml"

jobs:
  build:
    name: Build Zombie Survival APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer
          python -m pip install "cython<3.4"

      - name: Check project files
        run: |
          echo "===== PROJECT FILES ====="
          ls -la
          echo "===== BUILDODER SPEC ====="
          cat buildozer.spec

      - name: Remove old Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build Android APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          ACCEPT_EULA: "Y"
        run: |
          yes | buildozer -v android debug

      - name: Show generated APK
        if: success()
        run: |
          echo "===== APK FILES ====="
          ls -lh bin/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZombieSurvival-APK
          path: bin/*.apk
          if-no-files-found: error
